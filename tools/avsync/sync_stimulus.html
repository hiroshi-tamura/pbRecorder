<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>pbRecorder AV Sync Stimulus</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #surface {
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    #surface.flash {
      background: #fff;
    }
  </style>
</head>
<body>
  <div id="surface"></div>
  <script>
    const surface = document.getElementById("surface");
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    const audio = new AudioContextClass({ sampleRate: 48000 });

    function beep(at, duration) {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.frequency.value = 1000;
      gain.gain.setValueAtTime(0, at);
      gain.gain.linearRampToValueAtTime(0.7, at + 0.005);
      gain.gain.setValueAtTime(0.7, at + duration - 0.005);
      gain.gain.linearRampToValueAtTime(0, at + duration);
      osc.connect(gain).connect(audio.destination);
      osc.start(at);
      osc.stop(at + duration + 0.02);
    }

    function flash(delayMs, durationMs) {
      setTimeout(() => surface.classList.add("flash"), delayMs);
      setTimeout(() => surface.classList.remove("flash"), delayMs + durationMs);
    }

    async function start() {
      await audio.resume();
      const baseAudio = audio.currentTime + 1.0;
      const events = [1.0, 2.5, 4.0, 5.5];
      for (const t of events) {
        beep(baseAudio + t, 0.1);
        flash(Math.round((1.0 + t) * 1000), 100);
      }
    }

    window.addEventListener("load", () => setTimeout(start, 500));
    document.body.addEventListener("click", start, { once: true });
    window.addEventListener("keydown", start, { once: true });
  </script>
</body>
</html>
